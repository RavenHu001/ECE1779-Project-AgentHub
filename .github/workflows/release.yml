name: Release runtime image

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish only, publish and roll out, or restore the recorded application digest
        type: choice
        options: [publish, deploy, rollback]
        default: publish
      rollback_digest:
        description: Previous sha256 digest from the manager release record (rollback only)
        type: string

permissions:
  contents: read

concurrency:
  # Serialize publication on a ref without canceling an active release.
  # 同一 Git 引用上的发布串行执行，已有发布继续运行。
  group: release-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reuse Backend CI so publication uses the runtime image that passed its tests.
  # 复用后端 CI，确保发布的是通过测试的运行镜像。
  required-checks:
    if: inputs.operation != 'rollback'
    uses: ./.github/workflows/ci.yml
    with:
      export_runtime_image: true

  # Check the Swarm packaging independently of the backend CI job.
  # 在后端 CI 之外单独检查 Swarm 部署所需的文件和脚本。
  delivery-checks:
    if: inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check deployment scripts without a deployment
        run: |
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          python -m unittest discover -s deploy/tests -v
          python deploy/scripts/monitor.py --plan
      - name: Parse the Swarm stack using non-secret placeholders
        # Validate stack syntax without accessing a Swarm or registry.
        # 无需访问 Swarm 或镜像仓库即可验证 stack 配置语法。
        env:
          AGENTHUB_IMAGE: ghcr.io/example/agenthub/backend:validation
          POSTGRES_IMAGE: postgres:17-bookworm
          POSTGRES_DATA_PATH: /mnt/validation/postgres
          DB_PASSWORD_SECRET: validation-db
          BOOTSTRAP_PASSWORD_SECRET: validation-bootstrap
          OPENAI_API_KEY_SECRET: validation-openai
        run: |
          docker stack config -c deploy/swarm/stack.yaml > /dev/null
          REPLY_MODE=openai docker stack config -c deploy/swarm/stack.yaml -c deploy/swarm/openai.yaml > /dev/null

  # Require both the tested image and the deployment checks before pushing.
  # 测试镜像就绪且部署检查通过后，才推送镜像。
  publish:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    needs: [required-checks, delivery-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Grant package write access only to the publishing job.
    # 仅向发布任务授予软件包写入权限。
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runtime-image-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime
      - name: Publish the exact runtime image that passed CI
        id: publish
        # Pull by digest and compare image IDs before publishing deployment instructions.
        # 按摘要拉取镜像并比对 ID，然后输出部署所需的镜像信息。
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # Load the CI artifact, push its versioned tag, and publish a digest-qualified deploy reference.
        # 加载 CI 产物，推送带版本的标签，并输出包含镜像摘要的部署引用。
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend"
          tag="sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker load --input "$RUNNER_TEMP/runtime/agenthub-runtime.tar"
          docker tag agenthub-ci-backend:dev "$image:$tag"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          push_log="$RUNNER_TEMP/docker-push.log"
          docker push "$image:$tag" 2>&1 | tee "$push_log"
          digest=$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64})([[:space:]].*)?$/\1/p' "$push_log" | tail -n 1)
          if [[ ! $digest =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Docker push did not return a valid image digest'
            exit 1
          fi
          docker pull "$image@$digest" >/dev/null
          tested_id=$(docker image inspect agenthub-ci-backend:dev --format '{{.Id}}')
          published_id=$(docker image inspect "$image@$digest" --format '{{.Id}}')
          if [[ $tested_id != "$published_id" ]]; then
            echo '::error::Published digest does not match the runtime image tested by CI'
            exit 1
          fi
          printf 'Tested revision: `%s`\n\nVersioned image: `%s:%s`\n\nDeploy by digest: `%s`\n' "$GITHUB_SHA" "$image" "$tag" "$image@$digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Remove runner registry credentials
        if: always()
        run: docker logout ghcr.io

  deliver:
    name: ${{ inputs.operation }} ${{ needs.publish.outputs.digest || inputs.rollback_digest }}
    needs: publish
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          ((inputs.operation == 'deploy' && needs.publish.result == 'success') ||
           (inputs.operation == 'rollback' && needs.publish.result == 'skipped')) }}
    environment: production
    runs-on: ${{ vars.DELIVERY_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: agenthub-production
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Verify independent production approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            python3 -c '
          import json, os, sys
          actor = int(os.environ["GITHUB_ACTOR_ID"])
          reviews = json.load(sys.stdin)
          def approved(review):
              reviewer = review.get("user") or {}
              reviewer_id = reviewer.get("id")
              return (review.get("state") == "approved" and reviewer.get("type") == "User"
                      and type(reviewer_id) is int and reviewer_id > 0 and reviewer_id != actor
                      and any(env.get("name") == "production" for env in review.get("environments", [])))
          sys.exit(0 if actor > 0 and isinstance(reviews, list) and any(map(approved, reviews)) else 1)
          '
      - name: Request the approved manager operation
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
          ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
          TARGET: ${{ vars.DELIVERY_SSH_TARGET }}
          HOST_KEY: ${{ secrets.DELIVERY_KNOWN_HOSTS }}
          IDENTITY: ${{ secrets.DELIVERY_SSH_KEY }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            deploy) DIGEST=$PUBLISHED_DIGEST ;;
            rollback) DIGEST=$ROLLBACK_DIGEST ;;
            *) exit 1 ;;
          esac
          [[ $DIGEST =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ $TARGET =~ ^[a-z_][a-z0-9_-]*@[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          umask 077
          dir=$(mktemp -d "$RUNNER_TEMP/agenthub.XXXXXXXX")
          trap 'rm -f -- "$dir/key" "$dir/hosts"; rmdir -- "$dir"' EXIT
          printf '%s\n' "$IDENTITY" > "$dir/key"
          printf '%s\n' "$HOST_KEY" > "$dir/hosts"
          unset IDENTITY HOST_KEY
          ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=agenthub-manager -o UserKnownHostsFile="$dir/hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$dir/key" "$TARGET" "$OPERATION $DIGEST"
