name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      export_runtime_image:
        description: Export the tested runtime image for the release workflow
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A newer change replaces only the older CI run for the same Git reference.
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Node is a test-only dependency; the runtime image continues to serve static assets directly.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline deployment checks
        run: |
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          python -m unittest discover -s deploy/tests -v
          python deploy/scripts/smoke.py --plan
          python deploy/scripts/monitor.py --plan
      - name: Browser client state regressions
        # Exercise Unicode titles, uncertain retries, account cleanup, and stale history responses.
        run: node --test backend/tests/test_chat_client.cjs
      - name: Generate isolated configuration
        run: python scripts/init_env.py --project-name agenthub-ci
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build runtime and test images
        run: docker compose --profile test build api test
      - name: Lint and format
        run: docker compose run --rm --no-deps test sh -c 'ruff check . && ruff format --check .'
      - name: Test with isolated PostgreSQL
        # The test profile never connects fixtures to the development database.
        run: docker compose run --rm test
      - name: Start the application
        run: docker compose up -d --wait
      - name: Exercise live API and worker
        run: docker compose exec -T api python -m app.smoke
      - name: Export the tested runtime image
        if: inputs.export_runtime_image == true
        run: docker image save agenthub-ci-backend:dev --output "${{ runner.temp }}/agenthub-runtime.tar"
      - name: Retain the tested image for publication
        if: inputs.export_runtime_image == true
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-${{ github.run_id }}
          path: ${{ runner.temp }}/agenthub-runtime.tar
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error
      - name: Service status on failure
        if: failure()
        run: docker compose ps -a
      - name: Remove CI containers and disposable CI volumes
        # Volume deletion is limited to this disposable CI project.
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
