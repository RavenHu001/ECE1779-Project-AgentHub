name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Release runs can request the tested image as a workflow artifact.
  # 发布流程可请求将已测试镜像保存为工作流产物。
  workflow_call:
    inputs:
      export_runtime_image:
        description: Export the tested runtime image for the release workflow
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A newer change replaces only the older CI run for the same Git reference.
  # 新提交只替代同一 Git 引用的旧 CI 检查。
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Node is a test-only dependency; the runtime image continues to serve static assets directly.
      # Node 只用于测试；运行镜像仍由 API 直接提供静态资源。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline deployment checks
        # Use simulated Docker and HTTP services for deployment tests in PR CI.
        # PR CI 中的部署测试使用模拟的 Docker 和 HTTP 服务。
        run: |
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          caddy_dir="$RUNNER_TEMP/caddy-test"
          mkdir -p "$caddy_dir"
          curl -fsSL --retry 2 https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz -o "$caddy_dir/archive"
          echo "5b8cb7faf8726a2028ad96a66e54e6e81e8f361bc6175e5d22bbd997cc5177fb  $caddy_dir/archive" | sha256sum --check --status
          tar -xzf "$caddy_dir/archive" -C "$caddy_dir" caddy
          export PATH="$caddy_dir:$PATH"
          python -m unittest discover -s deploy/tests -v
          python deploy/scripts/smoke.py --plan
          python deploy/scripts/monitor.py --plan
      - name: Browser client state regressions
        # Exercise Unicode titles, uncertain retries, account cleanup, and stale history responses.
        # 验证 Unicode 标题、待确认重试、账号退出清理以及过期历史响应。
        run: node --test backend/tests/test_chat_client.cjs
      - name: Generate isolated configuration
        run: python scripts/init_env.py --project-name agenthub-ci
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build runtime and test images
        # Build the live smoke image and the test runner from the same checkout.
        # 从同一份代码构建运行冒烟测试的镜像和测试运行器。
        run: docker compose --profile test build api test
      - name: Lint and format
        run: docker compose run --rm --no-deps test sh -c 'ruff check . && ruff format --check .'
      - name: Test with isolated PostgreSQL
        # The test profile never connects fixtures to the development database.
        # 测试配置不会将夹具连接到开发数据库。
        run: docker compose run --rm test
      - name: Start the application
        run: docker compose up -d --wait
      - name: Exercise live API and worker
        # Exercise queue processing through the running Compose services.
        # 通过正在运行的 Compose 服务验证任务队列处理。
        run: docker compose exec -T api python -m app.smoke
      - name: Export the tested runtime image
        # Pass the image exercised by the smoke test to the release workflow.
        # 将通过冒烟测试的镜像交给发布工作流。
        if: inputs.export_runtime_image == true
        run: docker image save agenthub-ci-backend:dev --output "${{ runner.temp }}/agenthub-runtime.tar"
      - name: Retain the tested image for publication
        # The release job downloads this artifact from the same workflow run.
        # 发布任务从同一次工作流运行中下载该产物。
        if: inputs.export_runtime_image == true
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-${{ github.run_id }}
          path: ${{ runner.temp }}/agenthub-runtime.tar
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error
      - name: Service status on failure
        if: failure()
        run: docker compose ps -a
      - name: Remove CI containers and disposable CI volumes
        # Volume deletion is limited to this disposable CI project.
        # 删除数据卷仅限此临时 CI 项目。
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
